# ==========================================
# GitAR - Git Activity Reporter
# Default Profile
# ==========================================
#
# Running:
#
#   gitar
#
# loads this profile automatically.
#
# repo_path=. means the Git repository in
# the current working directory.
#
# Other profiles inherit these values and
# override only values they specify.
# ==========================================

repo_path=.

sections=header,sync,commits,daily-summary,statistics

commits_days=7
summary_days=14

ui=dots

sync=true
legend=false
verbose=false