name: Shell syntax

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        shell: bash
        run: |
          set -e
          for f in gitar install.sh uninstall.sh config.sh lib/*.sh sections/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done
